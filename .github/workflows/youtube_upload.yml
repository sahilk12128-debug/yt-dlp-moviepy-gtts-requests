name: Auto YouTube Shorts Upload

on:
  schedule:
    - cron: '0 8 * * *'  # रोज़ सुबह 8 बजे चलेगा
  workflow_dispatch:      # इससे 'Run workflow' बटन आ जाएगा

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client yt-dlp moviepy requests

      - name: Run Upload Script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python main.py
